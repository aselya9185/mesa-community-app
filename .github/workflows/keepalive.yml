name: keep alive

# A daily health check of the running app.
# Set the repository VARIABLE `SITE_URL` (Settings > Secrets and variables > Actions > Variables), e.g. https://your-domain.example
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: ping the health check
        run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL }}/api/health"
