name: Feature request
description: An idea for the app
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should it do
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Does it show, store or send anything about members? Which tables or policies would change?
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
        - [ ] tests cover it
