version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # the build and type check do not work with TypeScript 7 yet
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, ci]
